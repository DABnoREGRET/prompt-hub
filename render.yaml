databases:
  - name: prompthub-db
    databaseName: prompthub
    user: prompthub
    plan: free
    region: singapore

services:
  - type: web
    name: prompthub-api
    runtime: node
    plan: free
    region: singapore
    branch: prod
    buildCommand: npm install --include=dev && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_PGLITE
        value: "false"
      - key: AUTO_MIGRATE
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://dabnoregret.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: prompthub-db
          property: connectionString
