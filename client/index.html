<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-buttons="solid" data-motion class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Prompt Hub — Code Snippets, AI Prompts &amp; SKILL.md Vault</title>
    <meta
      name="description"
      content="Store reusable code snippets, parameterized AI prompts, copy-paste SKILL.md files, and curated harness plugins for engineering teams."
    />
    <meta name="site-kind" content="software" />
    <meta name="page-type" content="software" />
    <meta name="theme-color" content="#0f1f10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..700&family=Funnel+Sans:wght@400..600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('prompthub_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          root.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--p-bg)] text-[var(--p-ink)] antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
